name: pos_app
description: "ShopPad mobile point of sale, inventory and sales management."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Authentication and store data, including compact product images.
  firebase_core: ^2.25.4
  firebase_auth: ^4.17.4
  cloud_firestore: ^4.15.4

  # Durable local sales queue on mobile/desktop and IndexedDB on web.
  sembast: ^3.8.0
  sembast_web: ^2.4.0
  path_provider: ^2.1.5

  # Charts, barcode scanning, image selection, and audio feedback.
  fl_chart: ^0.68.0
  mobile_scanner: ^6.0.11
  image_picker: ^1.0.7
  audioplayers: ^5.2.1
  http: ^1.6.0
  cloud_functions: 4.7.6
  pdf: ^3.12.0
  printing: ^5.13.1
  # image 4.11 calls archive APIs unavailable in the resolved archive 4.0.9.
  image: 4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^2.5.2

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/sounds/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
          weight: 400
        - asset: assets/fonts/Cairo.ttf
          weight: 600
        - asset: assets/fonts/Cairo.ttf
          weight: 700
