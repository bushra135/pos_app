name: pos_app
description: "ShopPad: إدارة المتجر والمخزون والمبيعات ونقطة البيع."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Authentication and store data, including compact product images.
  firebase_core: ^2.25.4
  firebase_auth: ^4.17.4
  cloud_firestore: ^4.15.4

  # Charts, barcode scanning, image selection, and audio feedback.
  fl_chart: ^0.68.0
  mobile_scanner: ^6.0.11
  image_picker: ^1.0.7
  audioplayers: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/sounds/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
          weight: 400
        - asset: assets/fonts/Cairo.ttf
          weight: 600
        - asset: assets/fonts/Cairo.ttf
          weight: 700
